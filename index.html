<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>מעבדת הטעמים</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:#153c39;background:#f4f6f5;text-align:center;padding:24px;box-sizing:border-box}
  p{font-size:18px;line-height:1.6;margin:0 0 16px}
  button{font:700 17px Arial,sans-serif;border:0;border-radius:12px;padding:14px 22px;background:#153c39;color:#d9ff72;min-height:52px}
</style>
</head>
<body>
<div>
  <p id="msg">מעבירים אותך לניסוי…</p>
  <button id="retry" hidden onclick="go()">נסו שוב</button>
</div>
<script>
// The live server address lives in target.txt (one line). Edit only that file.
// It is fetched with a cache-buster, so an update works immediately even though
// GitHub Pages caches this HTML for ~10 minutes.
// Optional page: ?to=admin.html | results.html | operator.html | display.html
const PAGES = ['', 'admin.html', 'results.html', 'operator.html', 'display.html'];
async function go(){
  document.getElementById('retry').hidden = true;
  document.getElementById('msg').textContent = 'מעבירים אותך לניסוי…';
  const to = new URLSearchParams(location.search).get('to') || '';
  try {
    const r = await fetch('target.txt?ts=' + Date.now(), {cache: 'no-store'});
    const target = (await r.text()).trim().replace(/\/+$/, '');
    if (!/^https:\/\/[^\s]+$/.test(target)) throw new Error('bad target');
    location.replace(target + '/' + (PAGES.includes(to) ? to : ''));
  } catch (e) {
    document.getElementById('msg').textContent = 'השרת לא זמין כרגע. נסו שוב בעוד דקה.';
    document.getElementById('retry').hidden = false;
  }
}
go();
</script>
</body>
</html>
